<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">PoserionOS logo</title>
  <desc id="desc">A geometric P monogram with a cyan orbital signal stroke, paired with the PoserionOS wordmark.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="0.52" stop-color="#B8C7DC"/>
      <stop offset="1" stop-color="#7087A5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72E5FF"/>
      <stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
  </defs>
  <!-- Geometric P: deliberately abstract, not a shield or stock cybersecurity crest. -->
  <g transform="translate(28 20)">
    <path d="M30 202 L64 12 L171 12 C226 12 260 43 260 88 C260 134 224 164 169 164 L115 164 L108 202 Z
             M129 55 L115 122 L166 122 C190 122 205 109 205 88 C205 67 190 55 166 55 Z"
          fill="url(#metal)" fill-rule="evenodd"/>
    <path d="M30 202 L64 12 L99 12 L64 202 Z" fill="url(#cyan)" opacity="0.98"/>
    <path d="M78 184 C139 217 224 197 270 140" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round"/>
    <path d="M246 144 L270 140 L258 162" fill="none" stroke="#54D9FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, Montserrat, Arial, sans-serif" transform="translate(340 0)">
    <text x="0" y="132" fill="#EAF2FF" font-size="64" font-weight="650" letter-spacing="7">POSERION</text>
    <text x="405" y="132" fill="#45CFFF" font-size="64" font-weight="650" letter-spacing="2">OS</text>
    <rect x="2" y="157" width="540" height="2" rx="1" fill="#263C59"/>
    <rect x="2" y="157" width="112" height="2" rx="1" fill="#38CFFF"/>
    <text x="2" y="192" fill="#91A7C4" font-size="19" font-weight="500" letter-spacing="4">EXPLORE  ·  LEARN  ·  BUILD</text>
  </g>
</svg>
